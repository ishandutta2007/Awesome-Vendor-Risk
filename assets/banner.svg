<svg xmlns="http://www.w3.org/2000/svg" width="800" height="200" viewBox="0 0 800 200">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2027" />
      <stop offset="50%" stop-color="#203a43" />
      <stop offset="100%" stop-color="#2c5364" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="800" height="200" fill="url(#bgGrad)" rx="15" ry="15" />
  
  <text x="400" y="105" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="bold" fill="#ffffff" text-anchor="middle" filter="url(#glow)">
    Awesome Vendor Risk
    <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite" />
  </text>
  <text x="400" y="145" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#a8e063" text-anchor="middle">
    Curated List of TPRM Platforms &amp; Tools
  </text>
  
  <!-- Dynamic moving element -->
  <circle cx="50" cy="180" r="4" fill="#00c6ff">
    <animate attributeName="cx" values="50; 750; 50" dur="8s" repeatCount="indefinite" />
  </circle>
  <circle cx="750" cy="20" r="4" fill="#00c6ff">
    <animate attributeName="cx" values="750; 50; 750" dur="8s" repeatCount="indefinite" />
  </circle>
</svg>
